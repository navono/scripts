version: '3.8'

services:
  qwen3-vl-32b:
    image: qwenllm/qwenvl:qwen3vl-cu128
    container_name: qwen3vl-32b
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=5
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RAY_BACKEND_LOG_LEVEL=debug
      - RAY_LOG_TO_STDERR=1
      - TORCH_SYMM_MEM_DISABLE_MULTICAST=1
    volumes:
      - /data/models/hf_models/:/root/.cache/huggingface
    ports:
      - "18003:8000"
    ipc: host
    command:
      - "python"
      - "-m"
      - "vllm.entrypoints.openai.api_server"
      - "--model"
      - "Qwen/Qwen3-VL-32B-Instruct-FP8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "bfloat16"
      - "--quantization"
      - "fp8"
      - "--distributed-executor-backend"
      - "mp"
      - "--max-model-len"
      - "65536"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['5']
              capabilities: [gpu]
