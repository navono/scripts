version: '3.8'

services:
  glm-4.5-air-fp8:
    image: vllm/vllm-openai:v0.10.1.1
    container_name: glm-4.5-air-fp8
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - NVIDIA_VISIBLE_DEVICES=0,1,2,3
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RAY_BACKEND_LOG_LEVEL=debug
      - RAY_LOG_TO_STDERR=1
      - NCCL_P2P_DISABLE=1
      - NCCL_NVLS_ENABLE=0
    volumes:
      - /data/models/hf_models/:/root/.cache/huggingface
    ports:
      - "18001:18001"
    ipc: host
    command:
      - "--model"
      - "zai-org/GLM-4.5-Air-FP8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "18001"
      - "--tensor-parallel-size"
      - "4"
      - "--tool-call-parser"
      - "glm45"
      - "--reasoning-parser"
      - "glm45"
      - "--enable-auto-tool-choice"
      - "--served-model-name"
      - "glm-4.5-air-fp8"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1', '2', '3']
              capabilities: [gpu]
